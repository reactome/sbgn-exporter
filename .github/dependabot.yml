# Version updates, weekly and grouped, so the queue stays reviewable and the
# dependencies never drift far (as in reactome/WebsiteAngular and the other
# exporters). The dist branch is built from main, so updates go to main.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      # TypeScript's major versions wait until typescript-eslint's peer range takes
      # them: TypeScript 7 broke npm ci (ERESOLVE) in #26. Minor and patch still come.
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
      groups:
          npm:
              patterns: ['*']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
