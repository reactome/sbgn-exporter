# Version updates, weekly and grouped, so the queue stays reviewable and the
# dependencies never drift far (as in reactome/WebsiteAngular and the other
# exporters). The dist branch is built from main, so updates go to main.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      # Major versions held: TypeScript's until typescript-eslint's peer range takes
      # them (TypeScript 7 broke npm ci in #26); the others below. Minor and patch
      # updates still come.
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          # Node's types follow the Node the code runs on (24, package.json's engines).
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
          # A new driver major is checked against a real graph by hand (bulk run,
          # T026), and moves with pdf-export's, not on its own.
          - dependency-name: neo4j-driver
            update-types: ['version-update:semver-major']
      groups:
          npm:
              patterns: ['*']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
