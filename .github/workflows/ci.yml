name: sbgn-exporter ci

on:
    workflow_dispatch:
    pull_request:
        types:
            - opened
            - synchronize
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    # Every file as Prettier writes it (.prettierrc).
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Formatted
              run: npx --yes prettier@3.10.1 --check .

            # The Java reference harness lives in ci/reference/ and must be tracked: an
            # unanchored `reference/` in .gitignore once ignored it (spec 001 T031), and an
            # ignored folder's files are never committed (T012).
            - name: The reference harness is not ignored, and is committed
              run: |
                  if git check-ignore -q ci/reference/harness; then
                      echo "ci/reference/ is ignored by .gitignore" >&2
                      exit 1
                  fi
                  if [ -z "$(git ls-files ci/reference)" ]; then
                      echo "ci/reference/ has no committed files" >&2
                      exit 1
                  fi

    # The code's gates: types, lint and the unit tests, on Node 24's own type stripping.
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm

            - run: npm ci

            - name: Types
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            # xmllint, for ci/validate.sh and its tests (spec 001 T003, research R11).
            - name: libxml2's xmllint
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends libxml2-utils
                  xmllint --version

            - name: Unit tests
              run: npm test

            # Every installed package, development ones included, under a loose licence
            # (spec 001 T002, constitution VII).
            - name: Licences
              run: node ci/licences.ts

    # Every fixture's output valid against libSBGN 0.2's schema, the one the files declare
    # (spec 001 T019, constitution IV). Nothing to install but xmllint: the exporter has no
    # dependencies, and Node runs its TypeScript as it is.
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: libxml2's xmllint
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends libxml2-utils
                  xmllint --version

            - name: Every fixture's output
              run: node ci/fixture-output.ts output/fixtures

            - name: Valid against libSBGN 0.2's schema
              run: ci/validate.sh output/fixtures

    # The release's image (Dockerfile), which the release's Jenkins step pulls
    # (Jenkinsfile): built and checked on every run, and pushed to Reactome's public
    # registry from main alone, as sbml-exporter's is. The registry sign-in is the
    # organisation's role for GitHub Actions (vars.AWS_ROLE), by OpenID Connect: no
    # stored keys.
    #
    # After the gates: an image is pushed only from a commit that passed them, so a failed
    # check on main never becomes the release's image.
    image:
        needs: [format, check, validate]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            IMAGE: sbgn-exporter:ci
        steps:
            - uses: actions/checkout@v7

            - name: Build
              run: docker build -t "$IMAGE" .

            # The command line runs in it, and writes a document from a layout alone.
            - name: A layout converted in the image
              run: |
                  docker run --rm -v "$PWD/fixtures:/fixtures:ro" "$IMAGE" \
                      convert /fixtures/convert/classes.json > classes.sbgn
                  grep -q '<sbgn xmlns="http://sbgn.org/libsbgn/0.2">' classes.sbgn

            # Without the graph's address the bulk file is refused, exit 2, nothing written.
            - name: The bulk file refused without a graph
              run: |
                  set +e
                  docker run --rm "$IMAGE" bulk --diagrams /nowhere --out /tmp/x.tar.gz
                  status=$?
                  set -e
                  if [ "$status" -ne 2 ]; then
                      echo "expected exit 2, got $status" >&2
                      exit 1
                  fi

            - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_ROLE }}
                  aws-region: us-east-1

            - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2
              with:
                  registry-type: public

            - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
              name: Push, as its commit and as latest
              env:
                  REPOSITORY: ${{ steps.login-ecr.outputs.registry }}/reactome/sbgn-exporter
              run: |
                  short="${GITHUB_SHA:0:7}"
                  docker image tag "$IMAGE" "$REPOSITORY:$short"
                  docker image tag "$IMAGE" "$REPOSITORY:latest"
                  docker push "$REPOSITORY:$short"
                  docker push "$REPOSITORY:latest"
